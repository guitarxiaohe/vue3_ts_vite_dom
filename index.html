<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xiaohe-dom</title>
  </head>

  <body>
    <div id="app">
      <div id="app-loading">
        <div class="app-loading-spinner"></div>
        <p class="app-loading-text">Loading...</p>
      </div>
    </div>
    <style>
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f9fafb;
      }
      .app-loading-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e4e4e7;
        border-top-color: #6c3ff5;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      .app-loading-text {
        margin-top: 16px;
        font-size: 13px;
        color: #a1a1aa;
        font-family: system-ui, sans-serif;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #app-loading {
          background: #0f0f12;
        }
        .app-loading-spinner {
          border-color: #27272a;
          border-top-color: #6c3ff5;
        }
        .app-loading-text {
          color: #71717a;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
