services:
  web:
    build: .
    image: xiaohe-vue:local
    container_name: xiaohe-vue
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEB_HOST_PORT:-80}:80'
      - '${WEB_SSL_HOST_PORT:-443}:443'
    volumes:
      - /etc/nginx/ssl/guitarxiaohe.top:/etc/nginx/ssl/guitarxiaohe.top:ro
